server:
  port: ${PORT:8002}

spring:
  application:
    name: billing-service

  datasource:
    url: ${BILLING_DATABASE_URL:jdbc:postgresql://localhost:5432/role_manage}
    username: ${BILLING_DB_USER:role}
    password: ${BILLING_DB_PASSWORD:role}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # Separate history table so billing and other services don't conflict
    table: billing_flyway_schema_history

logging:
  level:
    com.coworking.billing: INFO
    org.flywaydb: INFO
