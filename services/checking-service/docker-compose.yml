# Postgres local para desarrollo del checking-service.
# Credenciales alineadas con el DATABASE_URL del .env.example:
#   postgres://role:role@localhost:5432/role_manage
# La imagen oficial corre como superuser, así que la migración puede CREATE EXTENSION.
services:
  db:
    image: postgres:16
    container_name: coworking-db
    environment:
      POSTGRES_USER: role
      POSTGRES_PASSWORD: role
      POSTGRES_DB: role_manage
    ports:
      - "5432:5432"
    volumes:
      - coworking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U role -d role_manage"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  coworking_pgdata:
