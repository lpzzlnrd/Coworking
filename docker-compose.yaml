services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: role
      POSTGRES_PASSWORD: role
      POSTGRES_DB: role_manage
    ports:
      - "5432:5432"
    volumes:
      - role_manage_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U role -d role_manage"]
      interval: 5s
      timeout: 5s
      retries: 10

  role-manage:
    build:
      context: ./services/role-manage
      dockerfile: .dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://role:role@db:5432/role_manage
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_ACCESS_TTL_SECONDS: 900
      CORS_ALLOWED_ORIGINS: '["http://localhost:5173"]'
      APP_ENV: dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"

  billing-service:
    build:
      context: ./services/billing-service
      dockerfile: .dockerfile
    environment:
      BILLING_DATABASE_URL: jdbc:postgresql://db:5432/role_manage
      BILLING_DB_USER: role
      BILLING_DB_PASSWORD: role
      PORT: 8002
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8002:8002"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_TARGET: http://role-manage:8000
    depends_on:
      - role-manage
      - billing-service
    ports:
      - "8080:8080"

volumes:
  role_manage_db:
